name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  HUSKY: "0" # husky fails in CI without a git hooks context

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Production deps only: the braces advisory (GHSA-vfj7-8cjw-p6xm) has no fix and is dev-only lint tooling.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Day 1: add a `supabase db push` step once a real project and credentials exist.
